<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>共識領航員 Demo</title>
<style>
:root{--bg:#f4f7fa;--cd:#fff;--tx:#1b2430;--mu:#66727f;--bd:#dde3ea;--pr:#0767A9;--ac:#087F86;--bad:#d6334f;--ok:#2e9b62;--wr:#e0912b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161c;--cd:#1a232c;--tx:#e8eef4;--mu:#98a6b3;--bd:#2b3743;--pr:#4aa3dd;--ac:#3fc0c7}}
:root[data-theme="dark"]{--bg:#10161c;--cd:#1a232c;--tx:#e8eef4;--mu:#98a6b3;--bd:#2b3743;--pr:#4aa3dd;--ac:#3fc0c7}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans TC",system-ui,sans-serif}
main{max-width:920px;margin:0 auto;padding:16px}
h1{margin:0;font-size:22px;color:var(--pr)}h1 small{color:var(--ac);font-size:14px}
.mu{color:var(--mu);font-size:13px}
nav{display:flex;gap:8px;margin:12px 0}
button,select,input{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
button{cursor:pointer}nav button.on,button.pri{background:var(--pr);color:#fff;border-color:var(--pr)}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:3px 0 8px}.bar i{display:block;height:100%}
.big{font-size:38px;font-weight:700}.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--bd);margin-right:4px}
label{display:block;font-size:13px;margin:8px 0 3px;color:var(--mu)}section{display:none}section.on{display:block}
.tl{border-left:3px solid var(--bd);padding-left:10px;margin:8px 0}.core{border-color:var(--pr)}.opt{border-color:var(--wr)}
.warn{color:var(--bad);font-size:13px}
</style></head><body><main>
<h1>共識領航員 <small>互動 Demo</small></h1>
<p class="mu">讓每個需求都被聽到　·　示範資料為模擬資料，分析為規則式運算（非生成式 AI）</p>
<nav><button data-t="h" class="on">① 主持人</button><button data-t="s">② 同學填寫</button><button data-t="r">③ 分析結果</button></nav>

<section id="h" class="on"><div class="cd"><b>候選方案</b><span class="mu">（可修改費用與結束時間，結果即時更新）</span><div class="g" id="pl"></div></div>
<div class="cd"><button class="pri" id="ld">載入 30 筆模擬同學資料</button> <button id="cl">清空</button> <span class="mu" id="cnt"></span></div></section>

<section id="s"><div class="cd"><b>匿名填寫</b><span class="mu">（不收集姓名，主持人只看得到統計）</span>
<div class="g"><div><label>最高預算上限（NT$）</label><input id="fb" type="number" value="300"></div>
<div><label>必須回家時間</label><input id="fc" type="time" value="21:00"></div>
<div><label>身體特殊需求</label><select id="fn"><option value="">無</option><option>暈車</option><option>氣喘</option><option>膝蓋</option><option>輪椅</option><option>素食</option></select></div></div>
<div class="g" id="fr"></div><p><button class="pri" id="sb">匿名送出</button> <span class="mu" id="ok"></span></p></div></section>

<section id="r"></section>
<p class="mu">已知限制：示範資料與計分規則為展示用；出席率＝無任何硬性限制（預算、時間、身體需求）阻擋的比例；負擔公平度＝費用不超過預算 80% 的比例；興趣覆蓋率＝給 4 星以上的比例。</p>
</main>
<script>
const $=s=>document.querySelector(s),T=h=>{const a=h.split(":");return +a[0]*60+ +a[1]};
const P=[{id:"A",n:"看電影",cost:350,end:"21:00"},{id:"B",n:"遊樂園",cost:250,end:"16:00",blk:1},{id:"C",n:"博物館",cost:300,end:"18:00"}];
const MOD={A:[{t:"19:00–21:00",n:"集合與電影放映",c:350,e:1260}],B:[{t:"13:00–16:00",n:"入口集合與暢玩",c:250,e:960}],
C:[{t:"14:00–17:00",n:"常設展覽探索與互動導覽",c:100,e:1020},{t:"17:00–19:00",n:"科學工作坊互動實驗",c:100,e:1140},{t:"19:00–20:00",n:"館內主題輕食交流會",c:100,e:1200}]};
const BLK=["暈車","氣喘","膝蓋","輪椅"],PRE=[[50,25,25],[60,20,20],[70,15,15],[80,10,10]];
let S=[],W=[70,15,15];
function sample(){let s=7;const r=()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const rt=b=>Math.max(1,Math.min(5,Math.round(b+(r()-.5)*3))),mk=(b,c,n)=>({b,c:T(c),n,r:[rt(4),rt(3.3),rt(3.6)]});
S=[];for(let i=0;i<3;i++)S.push(mk(400,"17:30",""));
[300,305,310,320,325,330,335,340,345,349,340,330].forEach(b=>S.push(mk(b,"21:30","")));
["暈車","氣喘","膝蓋","膝蓋","暈車","輪椅"].forEach(n=>S.push(mk(450,"22:00",n)));
for(let i=0;i<9;i++)S.push(mk(500,"22:00",""))}
const ev=(cost,end,blk,s)=>{const x=[];if(s.b<cost)x.push("b");if(s.c<end)x.push("t");if(blk&&BLK.includes(s.n))x.push("n");return x};
function stat(cost,end,blk,i){const n=S.length,c={b:0,t:0,n:0};let bl=0,f=0,l=0;
S.forEach(s=>{const x=ev(cost,end,blk,s);x.forEach(k=>c[k]++);if(x.length)bl++;if(cost<=.8*s.b)f++;if(s.r[i]>=4)l++});
return{c,bl,A:100*(n-bl)/n,F:100*f/n,I:100*l/n}}
const scw=(m,w)=>(w[0]*m.A+w[1]*m.F+w[2]*m.I)/(w[0]+w[1]+w[2]||1);
const bar=(l,v,col)=>`<div class="mu">${l}　${v.toFixed(0)}%</div><div class="bar"><i style="width:${v}%;background:${col}"></i></div>`;
const col=v=>v>=75?"var(--ok)":v>=55?"var(--wr)":"var(--bad)";
function R(){const n=S.length;$("#cnt").textContent=`目前 ${n} 位同學已回應`;
if(!n){$("#r").innerHTML='<div class="cd">尚無資料，請先載入模擬資料或到「同學填寫」送出。</div>';return}
const M=P.map((p,i)=>stat(p.cost,T(p.end),p.blk,i)),sw=M.map(m=>scw(m,W)),bi=sw.indexOf(Math.max(...sw)),bp=P[bi],mods=MOD[bp.id];
const E=stat(mods[0].c,mods[0].e,bp.blk,bi),es=scw(E,W),cnt=[0,0,0,0];
S.forEach(s=>{let c=0,k=0;for(const m of mods){if(c+m.c<=s.b&&m.e<=s.c&&!(k==0&&bp.blk&&BLK.includes(s.n))){c+=m.c;k++}else break}cnt[k]++});
const rk=w=>P.map((p,i)=>({n:p.n,s:scw(M[i],w)})).sort((a,b)=>b.s-a.s).map(x=>x.n+" "+x.s.toFixed(0)).join(" ＞ ");
let h='<div class="cd"><b>衝突診斷</b><span class="mu">　有多少人因預算、時間或需求無法參加</span>';
P.forEach((p,i)=>{const m=M[i];h+=`<div style="margin-top:8px"><b>${p.n}</b>　<span style="color:var(--bad)">${m.bl} / ${n} 人受阻</span><div class="bar"><i style="width:${100*m.bl/n}%;background:var(--bad)"></i></div><span class="tag">預算 ${m.c.b}</span><span class="tag">時間 ${m.c.t}</span><span class="tag">需求 ${m.c.n}</span></div>`});
h+=`</div><div class="cd"><b>包容性得分卡</b><div>權重（出席率／負擔公平度／興趣覆蓋率）：${W.join(" / ")}　<button data-p="2">70/15/15（簡報 70/30）</button> <button data-p="1">60/20/20（計分卡）</button></div>
<div class="g" style="margin-top:6px"><div><label>出席率權重 ${W[0]}</label><input type="range" data-w="0" min="0" max="100" value="${W[0]}"></div><div><label>負擔公平度權重 ${W[1]}</label><input type="range" data-w="1" min="0" max="100" value="${W[1]}"></div><div><label>興趣覆蓋率權重 ${W[2]}</label><input type="range" data-w="2" min="0" max="100" value="${W[2]}"></div></div>
<div class="g">`;
P.forEach((p,i)=>{const m=M[i];h+=`<div class="cd"><b>${p.n}</b>　<span class="mu">NT$${p.cost}・${p.end} 結束</span><div class="big" style="color:${col(sw[i])}">${sw[i].toFixed(0)}<small class="mu"> /100</small></div>${bar("出席率",m.A,col(m.A))}${bar("負擔公平度",m.F,col(m.F))}${bar("興趣覆蓋率",m.I,col(m.I))}</div>`});
h+=`</div><div class="mu">權重敏感度：${PRE.map(w=>`<div>${w.join("/")}：${rk(w)}</div>`).join("")}</div></div>
<div class="cd"><b>方案 E：以「${bp.n}」為核心的模組化行程</b><div class="big" style="color:${col(es)}">${es.toFixed(0)}<small class="mu"> /100</small></div>
${es<90?'<div class="warn">本組資料下未達 90 分，因此不應宣稱「保證 90 分以上」。</div>':""}`;
mods.forEach((m,k)=>{h+=`<div class="tl ${k?"opt":"core"}"><b>${m.t}</b> ${k?"自選":"必修"}　${m.n}　<span class="mu">NT$${m.c}</span></div>`});
h+=`<p class="mu">參與路徑：無法參加 ${cnt[0]} 人${mods.map((m,k)=>`；${k?"參加到第 "+(k+1)+" 段":"只參加核心"} ${cnt[k+1]||0} 人`).join("")}</p></div>`;
$("#r").innerHTML=h;
document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{W=PRE[+b.dataset.p].slice();R()});
document.querySelectorAll("[data-w]").forEach(b=>b.oninput=()=>{W[+b.dataset.w]=+b.value;R()})}
function plans(){$("#pl").innerHTML=P.map((p,i)=>`<div class="cd"><b>${p.id}　${p.n}</b><label>費用（NT$/人）</label><input type="number" value="${p.cost}" data-c="${i}"><label>預計結束</label><input type="time" value="${p.end}" data-e="${i}"></div>`).join("");
document.querySelectorAll("[data-c]").forEach(e=>e.oninput=()=>{P[+e.dataset.c].cost=+e.value;R()});
document.querySelectorAll("[data-e]").forEach(e=>e.onchange=()=>{if(e.value){P[+e.dataset.e].end=e.value;R()}});
$("#fr").innerHTML=P.map((p,i)=>`<div><label>${p.n}（1 沒興趣～5 非常想參加）</label><select data-f="${i}">${[1,2,3,4,5].map(v=>`<option ${v==3?"selected":""}>${v}</option>`).join("")}</select></div>`).join("")}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button,section").forEach(e=>e.classList.remove("on"));b.classList.add("on");$("#"+b.dataset.t).classList.add("on");R()});
$("#ld").onclick=()=>{sample();R()};$("#cl").onclick=()=>{S=[];R()};
$("#sb").onclick=()=>{S.push({b:+$("#fb").value||0,c:T($("#fc").value||"22:00"),n:$("#fn").value,r:[...document.querySelectorAll("[data-f]")].map(e=>+e.value)});$("#ok").textContent="已匿名送出，可到「分析結果」查看";R()};
plans();sample();R();
</script></body></html>
